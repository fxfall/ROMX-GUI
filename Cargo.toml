[workspace]
resolver = "2"
members = ["crates/romx-core", "crates/romx-cli", "crates/romx-gui"]

# zune-jpeg 0.5.14/0.5.15 has a warning! macro used as a tail expression,
# which fails on the current Rust toolchain. Keep the one-line local fix
# reproducible for the Slint image decoder dependency.
[patch.crates-io]
zune-jpeg = { path = "vendor/zune-jpeg" }
