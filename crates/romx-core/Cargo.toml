[package]
name = "romx-core"
version = "0.1.0"
edition = "2021"
description = "ROMX 1.0 container reader, writer, validator, and extractor"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
