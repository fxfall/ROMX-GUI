[package]
name = "romx-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for ROMX containers and RetroArch playlists"
license.workspace = true

[[bin]]
name = "romx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
romx-core = { path = "../romx-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
